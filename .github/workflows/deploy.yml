name: Despliegue con Autocorrección JCV CHAT FĀNYÌ

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 1. Descargar código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Forzar corrección y generación de estructura limpia
        run: |
          echo "Iniciando reestructuración automática..."
          # Si el archivo App.tsx está suelto en la raíz, el bot lo mueve a la carpeta 'src' obligatoriamente
          if [ -f "App.tsx" ]; then
            mkdir -p src
            mv App.tsx src/
            echo "Movido App.tsx a la carpeta src/ de forma automática."
          fi
          
          # Si falta el archivo puente main.tsx, el bot lo crea desde cero con código limpio
          if [ ! -f "src/main.tsx" ]; then
            mkdir -p src
            echo "import React from 'react';\nimport ReactDOM from 'react-dom/client';\nimport App from './App.tsx';\n\nReactDOM.createRoot(document.getElementById('root')!).render(<React.StrictMode><App /></React.StrictMode>);" > src/main.tsx
            echo "Creado src/main.tsx automático."
          fi

      - name: 4. Instalar dependencias con bypass de advertencias
        run: npm install --legacy-peer-deps || npm install

      - name: 5. Compilar ignorando cualquier advertencia menor
        run: npm run build

      - name: 6. Desplegar en vivo en GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
