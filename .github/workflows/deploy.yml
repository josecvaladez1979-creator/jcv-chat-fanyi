name: Despliegue con Autocorrección JCV CHAT FĀNYÌ

on:
  push:
    branches: [ main ]

# Permisos necesarios requeridos para desplegar usando el método oficial de GitHub Actions
permissions:
  contents: read
  pages: write
  id-token: write

# Permite un solo despliegue concurrente a la vez
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Forzar corrección y generación de estructura limpia
        run: |
          echo "Iniciando reestructuración automática..."
          if [ -f "App.tsx" ]; then
            mkdir -p src
            mv App.tsx src/
            echo "Movido App.tsx a la carpeta src/ de forma automática."
          fi
          
          if [ ! -f "src/main.tsx" ]; then
            mkdir -p src
            echo -e "import React from 'react';\nimport ReactDOM from 'react-dom/client';\nimport App from './App.tsx';\n\nReactDOM.createRoot(document.getElementById('root')!).render(<React.StrictMode><App /></React.StrictMode>);" > src/main.tsx
            echo "Creado src/main.tsx automático."
          fi

      - name: 4. Instalar dependencias con bypass de advertencias
        run: npm install --legacy-peer-deps || npm install

      - name: 5. Compilar ignorando cualquier advertencia menor
        run: npm run build

      - name: 6. Subir artefacto compilado de Vite
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist' # Sube la carpeta de producción generada por Vite

      - name: 7. Desplegar de forma oficial en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
