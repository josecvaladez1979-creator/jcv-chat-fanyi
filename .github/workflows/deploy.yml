name: Despliegue con Autocorrección JCV CHAT FĀNYÌ

on:
  push:
    branches: [ main ]

# Permisos necesarios requeridos para desplegar usando el método oficial de GitHub Actions
permissions:
  contents: read
  pages: write
  id-token: write

# Permite un solo despliegue concurrente a la vez
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 3. Forzar corrección y generación de estructura limpia
        run: |
          echo "Iniciando reestructuración automática con Tailwind CSS..."
          mkdir -p src

          if [ -f "App.tsx" ]; then
            mv App.tsx src/
            echo "Movido App.tsx a la carpeta src/ de forma automática."
          fi
          
          # 1. Crear el archivo de configuración de Tailwind CSS necesario
          echo -e "/** @type {import('tailwindcss').Config} */\nexport default {\n  content: ['./index.html', './src/**/*.{js,ts,jsx,tsx}'],\n  theme: { extend: {} },\n  plugins: [],\n}" > tailwind.config.js
          
          # 2. Crear un archivo postcss.config.js para que Vite procese los estilos
          echo -e "export default {\n  plugins: {\n    tailwindcss: {},\n    autoprefixer: {},\n  },\n}" > postcss.config.js

          # 3. Crear el archivo index.css inyectando las directivas oficiales de Tailwind
          echo -e "@tailwind base;\n@tailwind components;\n@tailwind utilities;" > src/index.css

          # 4. Sobrescribir main.tsx garantizando la importación de index.css
          echo -e "import React from 'react';\nimport ReactDOM from 'react-dom/client';\nimport App from './App.tsx';\nimport './index.css';\n\nReactDOM.createRoot(document.getElementById('root')!).render(<React.StrictMode><App /></React.StrictMode>);" > src/main.tsx
          echo "Estructura y archivos de Tailwind CSS forzados con éxito.

          - name: 4. Instalar dependencias con bypass de advertencias
        run: |
          npm install --legacy-peer-deps || npm install
          npm install -D tailwindcss postcss autoprefixer
        
      - name: 5. Compilar ignorando cualquier advertencia menor
        run: npm run build

       - name: 6. Subir artefacto compilado de Vite
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist' # Sube la carpeta de producción generada por Vite

      - name: 7. Desplegar de forma oficial en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
