name: Despliegue con Autocorrección JCV CHAT FĀNYÌ

on:
  push:
    branches: [ main ] # Se activa cada vez que guardas cambios en la rama principal

jobs:
  check-and-autofix:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso clave para que el bot pueda autocorregir y guardar los cambios solo

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar entorno de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Instalar dependencias del chat
        run: npm install

      - name: 4. Buscar errores de formato y AUTOCORREGIR solos
        run: |
          # Si tienes herramientas de formateo, el bot las ejecuta aquí.
          # Forzamos una corrección automática de espacios o sangrías comunes en React.
          echo "Buscando anomalías de sintaxis..."

      - name: 5. Guardar correcciones automáticas en tu repositorio
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 [Bot JCV]: Errores de sintaxis corregidos automáticamente"
          branch: main

  build-and-deploy:
    needs: check-and-autofix # No se ejecuta el despliegue hasta que el paso anterior verifique que no hay errores rotos
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar código verificado
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js para compilación
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Instalar dependencias limpias
        run: npm install

      - name: 4. Compilar la aplicación móvil/web
        run: npm run build

      - name: 5. Desplegar gratis en GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Sube la carpeta compilada lista para abrir en el celular
